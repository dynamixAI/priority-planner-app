<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
  <title>Reset Password | Agenndar</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <script>
    const cachedTheme = localStorage.getItem('planner-theme');
    document.documentElement.setAttribute('data-theme', cachedTheme || 'dark');
  </script>
  <style>
    :root {
      --bg: #efeeea;
      --card-bg: #ffffff;
      --text: #121214;
      --border: #dcdad5;
      --subtext: #6b6f76;
      --input-bg: #f5f4f0;
      --primary: #0891a3;
      --primary-hover: #076e7d;
    }
    [data-theme="dark"] {
      --bg: #121214;
      --card-bg: #1c1c1f;
      --text: #f2f1ee;
      --border: #2c2c30;
      --subtext: #9a9da3;
      --input-bg: #18181b;
      --primary: #00d6e8;
      --primary-hover: #00b8c9;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .card {
      background: var(--card-bg);
      padding: 2.25rem;
      border-radius: 12px;
      width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      border: 1px solid var(--border);
    }
    h2 { margin-top: 0; margin-bottom: 0.5rem; font-size: 1.4rem; color: var(--primary); }
    p { font-size: 0.85rem; color: var(--subtext); line-height: 1.4; margin-bottom: 1.25rem; }

    .alert-banner {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      font-size: 0.82rem;
      margin-bottom: 1.15rem;
      line-height: 1.4;
    }
    .alert-banner.visible { display: block; }

    .form-group { margin-bottom: 0.9rem; }
    label { display: block; font-size: 0.75rem; font-weight: bold; margin-bottom: 0.35rem; color: var(--subtext); }
    .input-wrapper { position: relative; display: flex; align-items: center; }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.65rem;
      padding-right: 2.5rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.85rem;
    }
    input:focus { outline: none; border-color: var(--primary); }
    .toggle-btn {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--subtext);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .toggle-btn:hover { color: var(--primary); }
    .toggle-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      background: var(--primary);
      color: #fff;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    .btn:hover { background: var(--primary-hover); }
  </style>
</head>
<body>
  <div class="card">
    <h2>Choose a New Password</h2>
    <p>Enter and confirm your new password below.</p>

    <div id="clientError" class="alert-banner"></div>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert-banner visible">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="POST" onsubmit="return validatePasswords(event)">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>New Password</label>
        <div class="input-wrapper">
          <input type="password" id="newPassword" name="password" required>
          <button type="button" class="toggle-btn" onclick="toggleVisibility('newPassword', this)">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label>Confirm New Password</label>
        <div class="input-wrapper">
          <input type="password" id="confirmPassword" name="confirm_password" required>
          <button type="button" class="toggle-btn" onclick="toggleVisibility('confirmPassword', this)">
            <svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn">Reset Password</button>
    </form>
  </div>

  <script>
    const eyeOpenSvg = `<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    const eyeClosedSvg = `<svg viewBox="0 0 24 24"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

    function toggleVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        btn.innerHTML = eyeClosedSvg;
      } else {
        input.type = "password";
        btn.innerHTML = eyeOpenSvg;
      }
    }

    function validatePasswords(event) {
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmPassword').value;
      const banner = document.getElementById('clientError');

      if (p1 !== p2) {
        event.preventDefault();
        banner.textContent = "Passwords do not match.";
        banner.classList.add('visible');
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
