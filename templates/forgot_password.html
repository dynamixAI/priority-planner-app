<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
  <title>Forgot Password | Priority Planner</title>
  <script>
    const cachedTheme = localStorage.getItem('planner-theme');
    document.documentElement.setAttribute('data-theme', cachedTheme || 'dark');
  </script>
  <style>
    :root {
      --bg: #efeeea;
      --card-bg: #ffffff;
      --text: #121214;
      --border: #dcdad5;
      --subtext: #6b6f76;
      --input-bg: #f5f4f0;
      --primary: #0891a3;
      --primary-hover: #076e7d;
    }
    [data-theme="dark"] {
      --bg: #121214;
      --card-bg: #1c1c1f;
      --text: #f2f1ee;
      --border: #2c2c30;
      --subtext: #9a9da3;
      --input-bg: #18181b;
      --primary: #00d6e8;
      --primary-hover: #00b8c9;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .card {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 12px;
      width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      border: 1px solid var(--border);
    }
    h2 { margin-top: 0; font-size: 1.3rem; color: var(--primary); }
    p { font-size: 0.85rem; color: var(--subtext); }
    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.75rem; font-weight: bold; margin-bottom: 0.35rem; color: var(--subtext); }
    input { width: 100%; box-sizing: border-box; padding: 0.65rem; border-radius: 6px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); }
    input:focus { outline: none; border-color: var(--primary); }
    .btn { width: 100%; padding: 0.75rem; border-radius: 6px; background: var(--primary); color: #fff; font-weight: bold; border: none; cursor: pointer; margin-top: 0.5rem; }
    .btn:hover { background: var(--primary-hover); }
    .links { text-align: center; margin-top: 1rem; font-size: 0.8rem; }
    .links a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Reset Password</h2>
    <p>Enter your registered email address and we'll send reset instructions.</p>
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Account Email</label>
        <input type="email" name="email" required>
      </div>
      <button type="submit" class="btn">Send Reset Link</button>
    </form>
    <div class="links"><a href="/login">Back to Sign In</a></div>
  </div>
</body>
</html>
