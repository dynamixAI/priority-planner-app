<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icon-180.png') }}">
  <title>Forgot Password | Agenndar</title>
  <script>
    const cachedTheme = localStorage.getItem('planner-theme');
    document.documentElement.setAttribute('data-theme', cachedTheme || 'dark');
  </script>
  <style>
    :root {
      --bg: #efeeea;
      --card-bg: #ffffff;
      --text: #121214;
      --border: #dcdad5;
      --subtext: #6b6f76;
      --input-bg: #f5f4f0;
      --primary: #0891a3;
      --primary-hover: #076e7d;
    }
    [data-theme="dark"] {
      --bg: #121214;
      --card-bg: #1c1c1f;
      --text: #f2f1ee;
      --border: #2c2c30;
      --subtext: #9a9da3;
      --input-bg: #18181b;
      --primary: #00d6e8;
      --primary-hover: #00b8c9;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.25rem;
      box-sizing: border-box;
      transition: background 0.15s ease, color 0.15s ease;
    }
    .card {
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      border: 1px solid var(--border);
    }
    h2 { margin-top: 0; margin-bottom: 0.5rem; font-size: 1.4rem; color: var(--primary); }
    p { font-size: 0.85rem; color: var(--subtext); line-height: 1.4; margin-bottom: 1.25rem; }

    .alert-banner {
      display: none;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
      font-size: 0.82rem;
      margin-bottom: 1.15rem;
      line-height: 1.4;
    }
    .alert-banner.visible { display: block; }

    .form-group { margin-bottom: 0.9rem; }
    label { display: block; font-size: 0.75rem; font-weight: bold; margin-bottom: 0.35rem; color: var(--subtext); }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.65rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--input-bg);
      color: var(--text);
      font-size: 0.85rem;
    }
    input:focus { outline: none; border-color: var(--primary); }
    .btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      background: var(--primary);
      color: #fff;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    .btn:hover { background: var(--primary-hover); }
    .links { text-align: center; margin-top: 1rem; font-size: 0.8rem; }
    .links a { color: var(--primary); text-decoration: none; }

    /* Phone layout: no floating card, no dead space — the screen itself
       is the form, content anchored near the top, everything sized for a
       thumb and a hand holding the phone, not a mouse pointer. */
    @media (max-width: 480px) {
      body {
        align-items: flex-start;
        justify-content: flex-start;
        padding: 2.5rem 1.25rem;
      }
      .card {
        max-width: none;
        padding: 0;
        border: none;
        box-shadow: none;
        background: transparent;
      }
      h2 { font-size: 2rem; margin-bottom: 0.75rem; }
      p { font-size: 0.95rem; margin-bottom: 1.75rem; }
      .form-group { margin-bottom: 1.25rem; }
      label { font-size: 0.95rem; margin-bottom: 0.5rem; }
      input {
        padding: 1rem;
        font-size: 1.05rem;
        border-radius: 10px;
      }
      .btn {
        padding: 1.1rem;
        font-size: 1.05rem;
        border-radius: 10px;
        margin-top: 0.75rem;
      }
      .links { font-size: 0.95rem; margin-top: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Forgot Password</h2>
    <p>Enter your account email and we'll send you a link to reset your password.</p>

    <div id="clientError" class="alert-banner"></div>
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        <div class="alert-banner visible">{{ messages[0] }}</div>
      {% endif %}
    {% endwith %}

    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <button type="submit" class="btn">Send Reset Link</button>
    </form>
    <div class="links"><a href="/login">← Back to Login</a></div>
  </div>
</body>
</html>
