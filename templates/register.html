<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Account | Priority Planner</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      background: #1e293b;
      padding: 2.25rem;
      border-radius: 12px;
      width: 380px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }
    h2 { margin-top: 0; font-size: 1.4rem; color: #38bdf8; }
    .form-group { margin-bottom: 0.9rem; }
    label { display: block; font-size: 0.75rem; font-weight: bold; margin-bottom: 0.35rem; color: #cbd5e1; }
    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    input {
      width: 100%;
      box-sizing: border-box;
      padding: 0.65rem;
      padding-right: 2.5rem;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 0.85rem;
    }
    input:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .toggle-btn {
      position: absolute;
      right: 8px;
      background: none;
      border: none;
      cursor: pointer;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
    }
    .toggle-btn:hover { color: #38bdf8; }
    .toggle-btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .btn {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      background: #0284c7;
      color: #fff;
      font-weight: bold;
      border: none;
      cursor: pointer;
      margin-top: 0.5rem;
      font-size: 0.9rem;
    }
    .btn:hover { background: #0369a1; }
    .flashes { color: #f87171; font-size: 0.8rem; margin-bottom: 0.75rem; }
    .links { text-align: center; margin-top: 1rem; font-size: 0.8rem; }
    .links a { color: #38bdf8; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Create an Account</h2>
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="flashes">{{ messages[0] }}</div>{% endif %}
    {% endwith %}
    <form method="POST" onsubmit="return validatePasswords()">
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required>
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" required>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrapper">
          <input type="password" id="regPassword" name="password" required>
          <button type="button" class="toggle-btn" onclick="toggleVisibility('regPassword', this)" aria-label="Toggle password view">
            <!-- Line Eye Open Icon -->
            <svg class="eye-icon" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label>Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" id="confirmPassword" name="confirm_password" required>
          <button type="button" class="toggle-btn" onclick="toggleVisibility('confirmPassword', this)" aria-label="Toggle password view">
            <svg class="eye-icon" viewBox="0 0 24 24">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      <button type="submit" class="btn">Register & Continue</button>
    </form>
    <div class="links">Already registered? <a href="/login">Log In</a></div>
  </div>

  <script>
    const eyeOpenSvg = `
      <svg viewBox="0 0 24 24">
        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
    `;

    const eyeClosedSvg = `
      <svg viewBox="0 0 24 24">
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
    `;

    function toggleVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (input.type === "password") {
        input.type = "text";
        btn.innerHTML = eyeClosedSvg;
      } else {
        input.type = "password";
        btn.innerHTML = eyeOpenSvg;
      }
    }

    function validatePasswords() {
      const p1 = document.getElementById('regPassword').value;
      const p2 = document.getElementById('confirmPassword').value;
      if (p1 !== p2) {
        alert("Passwords do not match. Please try again.");
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
