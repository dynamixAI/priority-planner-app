<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" sizes="32x32"
        href="{{ url_for('static', filename='favicon-32.png') }}">
  <title>{{ heading }} | Agenndar</title>
  {% include "_book_style.html" %}
</head>
<body>
  <main class="card">
    <div class="brand">Agenndar</div>
    <h1>{{ heading }}</h1>
    <p class="lead">{{ message }}</p>
    {% if cancel_form %}
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="submit">Yes, cancel it</button>
      </form>
    {% endif %}
    <p class="note">Planning made honest with
      <a href="/" target="_blank" rel="noopener">Agenndar</a></p>
  </main>
</body>
</html>
