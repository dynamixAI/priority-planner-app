<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Welcome | Priority Planner & Execution Dashboard</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; display: flex; align-items: center; justify-content: center; height: 100vh; }
    .card { background: #1e293b; padding: 2.5rem; border-radius: 12px; width: 440px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; }
    h1 { font-size: 1.6rem; margin-bottom: 0.5rem; color: #38bdf8; }
    p { font-size: 0.9rem; color: #94a3b8; line-height: 1.5; margin-bottom: 1.75rem; }
    .btn { display: block; width: 100%; box-sizing: border-box; padding: 0.75rem; border-radius: 6px; font-weight: bold; text-decoration: none; margin-bottom: 0.75rem; font-size: 0.95rem; cursor: pointer; border: none; }
    .btn-primary { background: #0284c7; color: white; }
    .btn-primary:hover { background: #0369a1; }
    .btn-outline { background: transparent; border: 1px solid #475569; color: #cbd5e1; }
    .btn-outline:hover { background: #334155; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Priority Execution Dashboard</h1>
    <p>Welcome! Plan your weeks with precision, set custom priority tiers, and conquer daily delivery with automated rescheduling.</p>
    <a href="/register" class="btn btn-primary">Create Free Account</a>
    <a href="/login" class="btn btn-outline">Sign In</a>
  </div>
</body>
</html>
