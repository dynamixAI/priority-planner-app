  <style>
    @font-face {
      font-family: 'Onest';
      src: url("{{ url_for('static', filename='fonts/Onest-Variable.woff2') }}")
          format('woff2');
      font-weight: 100 900;
      font-display: swap;
    }
    :root {
      --bg: #eef2f2; --card-bg: #ffffff; --text: #13201f; --border: #d9e1e1;
      --subtext: #5b6b6b; --input-bg: #f6f8f8; --primary: #0b8a97;
      --primary-hover: #08707b; --on-primary: #ffffff; --danger: #c2333a;
      --soft: #dff1f2; --shade: rgba(8, 18, 20, 0.45);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1617; --card-bg: #142123; --text: #e6efef; --border: #23373a;
        --subtext: #8fa3a3; --input-bg: #111c1e; --primary: #33d1de;
        --primary-hover: #5cdce6; --on-primary: #062226; --danger: #ff7a7f;
        --soft: #17393c; --shade: rgba(0, 0, 0, 0.6);
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Onest', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
      font-variant-numeric: tabular-nums;
      background: var(--bg); color: var(--text); margin: 0; min-height: 100vh;
      padding: calc(1.5rem + env(safe-area-inset-top)) 1rem
        calc(2.5rem + env(safe-area-inset-bottom));
    }
    button, input, textarea { font-family: inherit; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .card {
      max-width: 560px; margin: 0 auto; background: var(--card-bg);
      border: 1px solid var(--border); border-radius: 22px;
      padding: 1.4rem 1.2rem 1.5rem;
    }
    .brand { font-size: 0.8rem; font-weight: 700; color: var(--primary); }
    h1 { font-size: 1.5rem; font-weight: 650; letter-spacing: -0.02em;
         margin: 0.3rem 0 0.4rem; line-height: 1.2; }
    .lead, p { font-size: 0.88rem; color: var(--subtext); line-height: 1.5;
               margin: 0 0 1rem; }
    .error {
      border: 1px solid var(--danger); color: var(--danger); border-radius: 12px;
      padding: 0.7rem 0.85rem; font-size: 0.86rem; margin: 0.8rem 0;
      background: color-mix(in srgb, var(--danger) 10%, transparent);
    }
    .submit {
      width: 100%; margin-top: 1.2rem; padding: 0.95rem; border-radius: 14px;
      border: none; background: var(--primary); color: var(--on-primary);
      font-weight: 650; font-size: 1rem; cursor: pointer;
    }
    .submit:hover:not(:disabled) { background: var(--primary-hover); }
    .submit:disabled { opacity: 0.45; cursor: not-allowed; }
    .note { font-size: 0.78rem; color: var(--subtext); text-align: center;
            margin-top: 1.2rem; }
    .note a { color: var(--primary); }
  </style>
