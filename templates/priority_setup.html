<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Configure Priority Schema | Priority Planner</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
    .card { background: #1e293b; padding: 2.5rem; border-radius: 12px; width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155; }
    h2 { margin-top: 0; color: #38bdf8; font-size: 1.3rem; }
    p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 1.5rem; }
    .priority-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.75rem; }
    input[type="color"] { border: none; width: 38px; height: 38px; border-radius: 6px; cursor: pointer; background: none; }
    input[type="text"] { flex-grow: 1; padding: 0.6rem; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 0.85rem; }
    .btn { width: 100%; padding: 0.75rem; border-radius: 6px; background: #0284c7; color: #fff; font-weight: bold; border: none; cursor: pointer; margin-top: 1rem; font-size: 0.95rem; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Step 2: Choose Your Priority Schema</h2>
    <p>Customize your tags and colors below, or proceed with these standard defaults. You can always refine these later.</p>
    <form method="POST">
      {% for p in priorities %}
      <div class="priority-row">
        <input type="color" name="color_{{ p.id }}" value="{{ p.color }}">
        <input type="text" name="label_{{ p.id }}" value="{{ p.label }}">
      </div>
      {% endfor %}
      <button type="submit" class="btn">Save & Open Planner Dashboard</button>
    </form>
  </div>
</body>
</html>
