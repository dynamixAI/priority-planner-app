<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Agenndar admin</title>
  <style>
    @font-face {
      font-family: 'Onest';
      src: url("{{ url_for('static', filename='Onest-Variable.woff2') }}")
          format('woff2');
      font-weight: 100 900;
      font-display: swap;
    }
    :root {
      --bg: #eef2f2;
      --card-bg: #ffffff;
      --text: #13201f;
      --muted: #5b6b6b;
      --border: #d9e1e1;
      --primary: #0b8a97;
      --danger: #c2333a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1617;
        --card-bg: #142123;
        --text: #e6efef;
        --muted: #8fa3a3;
        --border: #23373a;
        --primary: #33d1de;
        --danger: #ff7a7f;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Onest', -apple-system, BlinkMacSystemFont, "Segoe UI",
          Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1rem;
    }
    form {
      width: 100%;
      max-width: 340px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.4rem 1.3rem;
    }
    h1 { font-size: 1.25rem; font-weight: 650; margin: 0 0 0.2rem; }
    p { color: var(--muted); font-size: 0.84rem; margin: 0 0 1rem; }
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
    }
    input[type="password"] {
      width: 100%;
      font: inherit;
      padding: 0.7rem 0.75rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
    }
    input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
    button {
      width: 100%;
      margin-top: 0.9rem;
      font: inherit;
      font-weight: 650;
      padding: 0.75rem;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #fff;
      cursor: pointer;
    }
    .error { color: var(--danger); font-size: 0.84rem; margin: 0.7rem 0 0; }
  </style>
</head>
<body>
  <form method="POST">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>Agenndar admin</h1>
    <p>Private stats. Owner only.</p>
    {% if not configured %}
    <p class="error">ADMIN_PASSWORD isn't set on this service yet.</p>
    {% endif %}
    <label for="pw">Admin password</label>
    <input type="password" id="pw" name="password" autocomplete="current-password"
      required autofocus>
    <button type="submit">Log in</button>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </form>
</body>
</html>
